<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
    <script>
        // Blokkeer rechtermuisknop
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Blokkeer F12 en sneltoetsen voor inspecteren
        document.onkeydown = function(e) {
            if (e.keyCode == 123) { return false; } // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 73) { return false; } // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 74) { return false; } // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 85) { return false; } // Ctrl+U (Broncode bekijken)
        };
    </script>
</head>
<body>
    <iframe src="https://botrix.live/widgets/chat/?bid=oO6q51Ksn3TfsMMsfIM%2BFw&bots=true&emojis=true&hideCommands=false&hideMessages=false&hideMessagesSeconds=10&fontSize=15&trovo=true&twitch=true&youtube=true&kick=true&livespace=false&platformIcon=true&theme=transparent&background=%23242424"></iframe>
</body>
</html>
